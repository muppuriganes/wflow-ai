# WFlow AI — local stack.
#   Infrastructure only (run backend/frontend on the host):  docker compose up -d
#   Everything in containers:                                 docker compose --profile app up -d --build
# Monitoring is added in M7.
# The internal API paths (/api/v1/internal/*) must not be exposed by a public proxy.

name: wflow

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wflow}
      POSTGRES_USER: ${POSTGRES_USER:-wflow_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wflow-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wflow-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-wflow-files}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET"
    restart: "no"

  # Durable workflow execution (M4). Development server with SQLite persistence; production
  # should use a Temporal cluster or Temporal Cloud (see docs/WORKFLOW_ENGINE.md).
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db", "--namespace", "wflow"]
    user: "0:0"
    ports:
      - "127.0.0.1:${TEMPORAL_HOST_PORT:-57233}:7233"
      - "127.0.0.1:${TEMPORAL_UI_HOST_PORT:-58233}:8233"
    volumes:
      - temporal-data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-51025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-58025}:8025"
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wflow_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-wflow}
      DATABASE_ADMIN_URL: postgresql+asyncpg://${POSTGRES_USER:-wflow_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wflow}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      GATEWAY_URL: http://messaging-gateway:8200
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8100}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  channel-worker:
    profiles: ["app"]
    build: ./backend
    command: ["python", "-m", "app.workers.channel_events"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wflow_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-wflow}
      DATABASE_ADMIN_URL: postgresql+asyncpg://${POSTGRES_USER:-wflow_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wflow}
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  workflow-worker:
    profiles: ["app"]
    build: ./backend
    command: ["python", "-m", "app.workers.workflow_worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wflow_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-wflow}
      DATABASE_ADMIN_URL: postgresql+asyncpg://${POSTGRES_USER:-wflow_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wflow}
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      GATEWAY_URL: http://messaging-gateway:8200
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      - temporal
      - backend
    restart: unless-stopped

  messaging-gateway:
    profiles: ["app"]
    build: ./services/messaging-gateway
    env_file: .env
    environment:
      GATEWAY_SKIP_DOTENV: "1"
      GATEWAY_PORT: "8200"
      REDIS_URL: redis://redis:6379/0
      BACKEND_INTERNAL_URL: http://backend:8000
    # Internal service: not published to the host. Only the backend talks to it.
    expose: ["8200"]
    volumes:
      - gateway-sessions:/data/sessions
    shm_size: "1gb" # Chromium needs more shared memory than Docker's 64 MB default
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8100/api/v1}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5180}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  gateway-sessions:
  temporal-data:
  postgres-data:
  redis-data:
  minio-data:
